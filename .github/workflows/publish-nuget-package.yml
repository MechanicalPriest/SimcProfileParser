name: Publish to nuget
on:
  push:
    branches:
      - master # Default release branch
jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      # Build
      - name: Install dependencies
        run: dotnet restore
      - name: Build the libraries
        run: dotnet build --configuration Release SimcProfileParser/SimcProfileParser.csproj
      # Package
      - name: Package the libraries
        run: dotnet pack --include-symbols -p:SymbolPackageFormat=snupkg --no-build -c Release SimcProfileParser/SimcProfileParser.csproj -o .
      # Publish
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Niphyr # nuget.org profile name
      - name: Publish on version change
        run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
